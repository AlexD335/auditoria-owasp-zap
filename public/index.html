<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MiniFacturas — Iniciar sesión</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; color: #222; }
    h1 { font-size: 1.4rem; }
    label { display: block; margin-top: 12px; font-size: .9rem; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 16px; cursor: pointer; }
    .hint { font-size: .8rem; color: #666; margin-top: 24px; }
    form.search { margin-top: 40px; border-top: 1px solid #ddd; padding-top: 20px; }
  </style>
</head>
<body>
  <h1>MiniFacturas</h1>
  <form method="POST" action="/login">
    <label>Usuario
      <input type="text" name="username" required>
    </label>
    <label>Contraseña
      <input type="password" name="password" required>
    </label>
    <button type="submit">Ingresar</button>
  </form>

  <form class="search" method="GET" action="/search">
    <label>Buscar
      <input type="text" name="q" placeholder="Buscar factura o usuario...">
    </label>
    <button type="submit">Buscar</button>
  </form>

  <p class="hint">Usuarios de prueba: carlos/carlos123 · maria/maria2024 · admin/S3cr3t0Admin!</p>
</body>
</html>
